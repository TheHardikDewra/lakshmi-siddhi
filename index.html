<!doctype html>
<html lang="hi" >
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>लक्ष्मी-सिद्धि — लक्ष्मी तन्त्र और सम्बन्धित मन्त्र साधनाओं का विशिष्ट संग्रह</title>
<meta name="description" content="डॉ॰ चमनलाल गौतम द्वारा सम्पादित लक्ष्मी-सिद्धि का पूर्ण पाठ — 47 अध्याय, लक्ष्मी-तन्त्र के 25 अध्याय, मन्त्र प्रयोग और स्तोत्र। खोज सहित।">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="लक्ष्मी-सिद्धि — लक्ष्मी तन्त्र और सम्बन्धित मन्त्र साधनाओं का विशिष्ट संग्रह">
<meta property="og:description" content="डॉ॰ चमनलाल गौतम द्वारा सम्पादित लक्ष्मी-सिद्धि का पूर्ण पाठ — 47 अध्याय, लक्ष्मी-तन्त्र के 25 अध्याय, मन्त्र प्रयोग और स्तोत्र। खोज सहित।">
<meta property="og:type" content="book">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF9F4; --paper-2:#F2EEE4; --rule:#DED7C6;
  --ink:#1A1713; --ink-2:#5A5346; --ink-3:#8A8272;
  --accent:#9A6B12; --accent-soft:#F0DFB4;
  --sans:'Inter','Tiro Devanagari Hindi',system-ui,sans-serif; --serif:'Tiro Devanagari Hindi',Georgia,serif;
  --r:3px; --sidebar:310px; --measure:740px;
}
:root:not([data-theme=light]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --paper:#14120F; --paper-2:#1D1A16; --rule:#332E27;
    --ink:#EFE9DC; --ink-2:#ADA595; --ink-3:#7C7566;
    --accent:#D8A83E; --accent-soft:#4A3810;
  }
}
:root[data-theme=dark]{
  --paper:#14120F; --paper-2:#1D1A16; --rule:#332E27;
  --ink:#EFE9DC; --ink-2:#ADA595; --ink-3:#7C7566;
  --accent:#D8A83E; --accent-soft:#4A3810;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;fill:currentColor}
::selection{background:var(--accent-soft);color:var(--ink)}

/* ---------------------------------------------------------------- chrome -- */
header{position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);display:flex;align-items:center;
  gap:14px;padding:0 18px;height:58px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px;
  letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--ink-3);font-size:12.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;
  border:1px solid transparent;border-radius:var(--r);color:var(--ink-2)}
.iconbtn:hover{background:var(--paper-2);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
#theme svg:last-child{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]) #theme svg:first-child{display:none}
  :root:not([data-theme=light]) #theme svg:last-child{display:block}
}
:root[data-theme=dark] #theme svg:first-child{display:none}
:root[data-theme=dark] #theme svg:last-child{display:block}
:root[data-theme=light] #theme svg:first-child{display:block}
:root[data-theme=light] #theme svg:last-child{display:none}
#menu{display:none}
.progress{position:absolute;left:0;bottom:-1px;height:2px;
  background:var(--accent);width:0;transition:width .12s linear}

/* --------------------------------------------------------------- sidebar -- */
.wrap{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
aside{position:sticky;top:58px;height:calc(100dvh - 58px);overflow-y:auto;
  border-right:1px solid var(--rule);background:var(--paper);
  padding:22px 0 60px;scrollbar-width:thin}
.sec{padding:0 20px;margin:22px 0 6px}
.sec:first-child{margin-top:0}
.sec h3{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-weight:600}
.sec p{margin:3px 0 0;font-size:11.5px;color:var(--ink-3)}
nav a{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;
  padding:7px 20px;text-decoration:none;border-left:2px solid transparent;
  color:var(--ink-2);font-size:13.5px;line-height:1.42}
nav a:hover{background:var(--paper-2);color:var(--ink)}
nav a.on{border-left-color:var(--accent);color:var(--ink);
  background:var(--paper-2);font-weight:500}
nav a i{font-style:normal;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
nav a.on i{color:var(--accent)}
.frontlink{grid-template-columns:1fr;padding-left:22px}

/* ---------------------------------------------------------------- reader -- */
main{min-width:0;padding:0 0 120px}
article{max-width:var(--measure);margin:0 auto;padding:52px 28px 0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 12px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(27px,3.6vw,38px);
  line-height:1.18;letter-spacing:-.015em;margin:0}
.summary{margin:16px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.62;
  border-left:2px solid var(--rule);padding-left:14px}
.meta{margin:18px 0 0;font-size:12.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.body{margin-top:38px;border-top:1px solid var(--rule);padding-top:34px}
.body p{font-family:var(--serif);font-size:17.5px;line-height:1.75;
  margin:0 0 1.15em;text-align:left;hanging-punctuation:first}
h2.h{font-family:var(--serif);font-size:19px;font-weight:600;
  margin:2em 0 .7em;letter-spacing:-.01em}
h2.h::before{content:"";display:block;width:26px;height:2px;
  background:var(--accent);margin-bottom:12px}

/* numbered verse */
.v{display:grid;grid-template-columns:42px minmax(0,1fr);gap:2px;
  margin:0 0 1.05em}
.v .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  padding-top:.55em;letter-spacing:.02em}
.v p{margin:0}
.v:target .n,.v.hit .n{color:var(--accent);font-weight:600}

/* Sanskrit mula */
.mula{margin:1.5em 0;padding:16px 18px;background:var(--paper-2);
  border-left:2px solid var(--accent);border-radius:0 var(--r) var(--r) 0}
.mula div{font-family:var(--serif);font-size:17px;line-height:1.95;
  color:var(--ink)}
.fig{margin:1.5em 0;padding:14px 18px;border:1px dashed var(--rule);
  border-radius:var(--r)}
.fig .cells{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px;color:var(--ink);word-spacing:.5em;line-height:2}
.fig small{display:block;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
sup.fn{font-size:.66em;vertical-align:super;color:var(--accent);
  font-weight:600;padding:0 .5px;font-family:var(--sans)}
.pg{float:right;clear:right;margin:.35em -74px 0 0;font-size:11px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
  border-left:1px solid var(--rule);padding-left:7px;letter-spacing:.03em}
@media (max-width:1180px){.pg{display:none}}

/* notes */
.notes{margin-top:56px;border-top:1px solid var(--rule);padding-top:26px}
.notes h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0 0 16px;font-weight:600}
.notes ol{margin:0;padding:0;list-style:none}
.notes li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;
  font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-bottom:9px}
.notes li b{color:var(--accent);font-weight:600;font-size:11.5px;
  padding-top:.25em;font-variant-numeric:tabular-nums}

/* reference lists */
.pairs{margin-top:34px;column-width:280px;column-gap:38px}
.pairs div{break-inside:avoid;font-size:13.5px;line-height:1.62;
  color:var(--ink-2);margin-bottom:5px}
.pairs div b{color:var(--ink);font-weight:600}

/* chapter footer nav */
.pager{max-width:var(--measure);margin:64px auto 0;padding:22px 28px 0;
  border-top:1px solid var(--rule);display:flex;gap:12px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--rule);
  border-radius:var(--r);padding:13px 15px;display:flex;gap:11px;
  align-items:center;min-width:0}
.pager a:hover{border-color:var(--accent);background:var(--paper-2)}
.pager a.next{flex-direction:row-reverse;text-align:right}
.pager svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.pager span{display:block;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.pager strong{display:block;font-weight:500;font-size:13.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --------------------------------------------------------------- search --- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);
  display:none;padding:9vh 18px 18px}
.overlay.open{display:block}
.panel{max-width:660px;margin:0 auto;background:var(--paper);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;
  max-height:78vh;display:flex;flex-direction:column}
.panel .top{display:flex;align-items:center;gap:11px;padding:0 15px;
  border-bottom:1px solid var(--rule);height:52px;flex:none}
.panel input{flex:1;border:0;background:none;font-size:15.5px;color:var(--ink);
  outline:none;font-family:var(--sans)}
.panel input::placeholder{color:var(--ink-3)}
.panel .top svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.results{overflow-y:auto;padding:6px}
.results a{display:block;text-decoration:none;padding:11px 13px;
  border-radius:var(--r)}
.results a:hover,.results a.sel{background:var(--paper-2)}
.results .where{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:4px}
.results .snip{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.results mark{background:var(--accent-soft);color:var(--ink);
  border-radius:2px;padding:0 2px}
.empty{padding:26px 15px;color:var(--ink-3);font-size:13.5px;text-align:center}
kbd{font-family:var(--sans);font-size:10.5px;border:1px solid var(--rule);
  border-radius:2px;padding:1px 5px;color:var(--ink-3)}

.loading{padding:80px 28px;text-align:center;color:var(--ink-3);font-size:14px}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:58px;width:min(88vw,330px);z-index:50;
    border-right:1px solid var(--rule);transform:translateX(-101%);
    transition:transform .2s ease}
  aside.open{transform:none}
  #menu{display:grid}
  article{padding-top:34px}
  .backdrop{position:fixed;inset:58px 0 0;background:rgba(0,0,0,.38);
    z-index:45;display:none}
  .backdrop.open{display:block}
}
@media print{
  header,aside,.pager,.overlay{display:none}
  .wrap{display:block} article{max-width:none}
}
</style>
</head>
<body>

<header>
  <button class="iconbtn" id="menu" aria-label="Contents"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224 128a8 8 0 0 1-8 8H40a8 8 0 0 1 0-16h176a8 8 0 0 1 8 8m-184-56h176a8 8 0 0 0 0-16H40a8 8 0 0 0 0 16m176 112H40a8 8 0 0 0 0 16h176a8 8 0 0 0 0-16"/></svg></button>
  <div class="brand"><b>लक्ष्मी-सिद्धि</b><span>लक्ष्मी तन्त्र और सम्बन्धित मन्त्र साधनाओं का विशिष्ट संग्रह</span></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="find" aria-label="Search (press /)"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="m229.66 218.34-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72 72.08 72.08 0 0 1-72-72"/></svg></button>
  <button class="iconbtn" id="theme" aria-label="Toggle theme"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M120 40V16a8 8 0 0 1 16 0v24a8 8 0 0 1-16 0m72 88a64 64 0 1 1-64-64 64.07 64.07 0 0 1 64 64m-16 0a48 48 0 1 0-48 48 48.05 48.05 0 0 0 48-48M58.34 69.66a8 8 0 0 0 11.32-11.32l-16-16a8 8 0 0 0-11.32 11.32Zm0 116.68-16 16a8 8 0 0 0 11.32 11.32l16-16a8 8 0 0 0-11.32-11.32M192 72a8 8 0 0 0 5.66-2.34l16-16a8 8 0 0 0-11.32-11.32l-16 16A8 8 0 0 0 192 72m5.66 114.34a8 8 0 0 0-11.32 11.32l16 16a8 8 0 0 0 11.32-11.32ZM48 128a8 8 0 0 0-8-8H16a8 8 0 0 0 0 16h24a8 8 0 0 0 8-8m80 80a8 8 0 0 0-8 8v24a8 8 0 0 0 16 0v-24a8 8 0 0 0-8-8m112-88h-24a8 8 0 0 0 0 16h24a8 8 0 0 0 0-16"/></svg><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M233.54 142.23a8 8 0 0 0-8-2 88.08 88.08 0 0 1-109.8-109.8 8 8 0 0 0-10-10 104.84 104.84 0 0 0-52.91 37A104 104 0 0 0 136 224a103.1 103.1 0 0 0 62.52-20.88 104.84 104.84 0 0 0 37-52.91 8 8 0 0 0-1.98-7.98m-44.64 48.11A88 88 0 0 1 65.66 67.11a89 89 0 0 1 31.4-26A106 106 0 0 0 96 56a104.11 104.11 0 0 0 104 104 106 106 0 0 0 14.90-1.06 89 89 0 0 1-26 31.4"/></svg></button>
  <div class="progress" id="bar"></div>
</header>

<div class="wrap">
  <aside id="side"><nav id="toc"></nav></aside>
  <main><div id="view"><div class="loading">Loading the text…</div></div></main>
</div>
<div class="backdrop" id="backdrop"></div>

<div class="overlay" id="ov">
  <div class="panel">
    <div class="top"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="m229.66 218.34-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72 72.08 72.08 0 0 1-72-72"/></svg><input id="q" placeholder="पूरी पुस्तक में खोजें…" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
    <div class="results" id="res"><div class="empty">मन्त्र, श्लोक या शब्द टाइप करें</div></div>
  </div>
</div>

<script>
const IC={left:`<svg viewBox="0 0 256 256" aria-hidden="true"><path d="M165.66 202.34a8 8 0 0 1-11.32 11.32l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 0 1 11.32 11.32L91.31 128Z"/></svg>`,right:`<svg viewBox="0 0 256 256" aria-hidden="true"><path d="M181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128 90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg>`};
const LANG='hi';
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let BOOK=null, FLAT=[], IDX=[], cur=0, sel=0, hits=[];

/* footnote markers survive OCR as a digit glued to the preceding word */
const supers = t => LANG==='en'
  ? esc(t)
      /* glued to the previous word: "described.1" */
      .replace(/([a-zA-Z\)\.,;:”"'])(\d{1,2})(?![\d\w])/g,'$1<sup class="fn">$2</sup>')
      /* left stranded after a space: "during operation? 1" */
      .replace(/([.?!,;:])\s(\d{1,2})(?=$|\s[A-Z“"(])/g,'$1<sup class="fn">$2</sup>')
  : esc(t);

const pgMark = b => b.pg ? `<i class="pg">${LANG==='hi'?'पृष्ठ ':'p. '}${b.pg}</i>` : '';

function renderBlocks(bl){
  return bl.map(b=>{
    if(b.t==='h')    return `<h2 class="h">${pgMark(b)}${esc(b.v)}</h2>`;
    if(b.t==='verse') return `<div class="mula">${pgMark(b)}${b.v.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
    if(b.t==='fig')  return `<div class="fig">${pgMark(b)}<div class="cells">${esc(b.v.join('  '))}</div><small>${LANG==='hi'?'यन्त्र — मूल पुस्तक का आरेख; स्कैन में क्रम बिखर गया है।':'Yantra diagram — the scan flattened the grid.'}</small></div>`;
    if(b.t==='v')    return `<div class="v" id="v${b.n}"><div class="n">${esc(b.n)}</div><p>${pgMark(b)}${supers(b.v)}</p></div>`;
    return `<p>${pgMark(b)}${supers(b.v)}</p>`;
  }).join('');
}

function renderNotes(notes){
  if(!notes||!notes.length) return '';
  return `<div class="notes"><h2>Notes</h2><ol>${notes.map(n=>
    `<li><b>${esc(n.mark)}</b><div>${esc(n.text)}</div></li>`).join('')}</ol></div>`;
}

function renderPairs(rows,title,eyebrow){
  return `<p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(title)}</h1>
    <p class="meta">${rows.length.toLocaleString()} entries</p>
    <div class="pairs">${rows.map(r=>`<div>${esc(r)}</div>`).join('')}</div>`;
}

function view(i){
  cur=Math.max(0,Math.min(FLAT.length-1,i));
  const e=FLAT[cur];
  let html='';
  if(e.kind==='chapter'){
    const c=e.data;
    html=`<p class="eyebrow">${esc(e.eyebrow)}</p><h1>${esc(c.title||e.label)}</h1>
      ${c.summary?`<p class="summary">${esc(c.summary)}</p>`:''}
      <p class="meta">${LANG==='hi'?`पृष्ठ ${c.start}–${c.end}`:`pp. ${c.start}–${c.end}`} · ${c.words.toLocaleString()} ${LANG==='hi'?'शब्द':'words'}${c.notes&&c.notes.length?` · ${c.notes.length} notes`:''}</p>
      <div class="body">${c.blocks.length?renderBlocks(c.blocks):`<p><em>${LANG==='hi'?'यह अध्याय मूल में उपलब्ध नहीं है।':'This chapter is missing from the original manuscript.'}</em></p>`}</div>
      ${renderNotes(c.notes)}`;
  } else if(e.kind==='prose'){
    html=`<p class="eyebrow">${esc(e.eyebrow)}</p><h1>${esc(e.label)}</h1>
      <div class="body">${renderBlocks(e.data.blocks)}</div>${renderNotes(e.data.notes)}`;
  } else {
    html=renderPairs(e.data,e.label,e.eyebrow);
  }
  const p=FLAT[cur-1], n=FLAT[cur+1];
  const pager=`<div class="pager">
    ${p?`<a href="#${p.id}" data-go="${cur-1}">${IC.left}<div><span>${LANG==='hi'?'पिछला':'Previous'}</span><strong>${esc(p.label)}</strong></div></a>`:'<div style="flex:1"></div>'}
    ${n?`<a class="next" href="#${n.id}" data-go="${cur+1}">${IC.right}<div><span>${LANG==='hi'?'अगला':'Next'}</span><strong>${esc(n.label)}</strong></div></a>`:'<div style="flex:1"></div>'}
  </div>`;
  $('#view').innerHTML=`<article>${html}</article>${pager}`;
  document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on',a.dataset.go==String(cur)));
  const on=document.querySelector('#toc a.on');
  if(on&&on.getBoundingClientRect){const r=on.getBoundingClientRect();
    if(r.top<70||r.bottom>innerHeight)on.scrollIntoView({block:'center'});}
  if(location.hash.slice(1)!==e.id) history.replaceState(null,'','#'+e.id);
  document.title=`${e.label} — लक्ष्मी-सिद्धि`;
  scrollTo({top:0});
  closeSide();
}

function buildToc(){
  const out=[];
  let lastSec=null;
  FLAT.forEach((e,i)=>{
    if(e.section!==lastSec){
      lastSec=e.section;
      out.push(`<div class="sec"><h3>${esc(e.section)}</h3>${e.sectionNote?`<p>${esc(e.sectionNote)}</p>`:''}</div>`);
    }
    out.push(`<a href="#${e.id}" data-go="${i}" class="${e.num?'':'frontlink'}">
      ${e.num?`<i>${esc(e.num)}</i>`:''}<div>${esc(e.label)}</div></a>`);
  });
  $('#toc').innerHTML=out.join('');
}

/* ------------------------------------------------------------- search ---- */
function buildIndex(){
  IDX=[];
  FLAT.forEach((e,i)=>{
    const push=(txt,anchor)=>{ if(txt&&txt.length>2) IDX.push({i,txt,low:txt.toLowerCase(),anchor}); };
    if(e.kind==='chapter'||e.kind==='prose'){
      (e.data.blocks||[]).forEach(b=>{
        if(b.t==='verse') push(b.v.join(' '),null);
        else if(b.t==='fig') return;
        else push(b.v, b.t==='v'?'v'+b.n:null);
      });
      (e.data.notes||[]).forEach(n=>push(n.text,null));
    } else (e.data||[]).forEach(r=>push(r,null));
  });
}
function search(qs){
  const q=qs.trim().toLowerCase();
  if(q.length<2){ $('#res').innerHTML=`<div class="empty">मन्त्र, श्लोक या शब्द टाइप करें</div>`; hits=[]; return; }
  hits=[];
  for(const r of IDX){
    const at=r.low.indexOf(q);
    if(at<0) continue;
    hits.push({i:r.i,at,txt:r.txt,anchor:r.anchor});
    if(hits.length>=140) break;
  }
  if(!hits.length){ $('#res').innerHTML=`<div class="empty">${LANG==='hi'?'कुछ नहीं मिला':'Nothing found'}</div>`; return; }
  sel=0;
  $('#res').innerHTML=hits.map((h,k)=>{
    const s=Math.max(0,h.at-58), pre=(s?'…':'')+h.txt.slice(s,h.at);
    const post=h.txt.slice(h.at+q.length, h.at+q.length+92)+(h.txt.length>h.at+q.length+92?'…':'');
    return `<a href="#" data-k="${k}" class="${k===0?'sel':''}">
      <div class="where">${esc(FLAT[h.i].label)}</div>
      <div class="snip">${esc(pre)}<mark>${esc(h.txt.substr(h.at,q.length))}</mark>${esc(post)}</div></a>`;
  }).join('');
  $('#res').scrollTop=0;
}
function goHit(k){
  const h=hits[k]; if(!h) return;
  closeOv(); view(h.i);
  if(h.anchor) setTimeout(()=>{
    const el=document.getElementById(h.anchor);
    if(el){el.scrollIntoView({block:'center'});el.classList.add('hit');}
  },40);
}
const openOv=()=>{$('#ov').classList.add('open');$('#q').focus();$('#q').select()};
const closeOv=()=>$('#ov').classList.remove('open');
const closeSide=()=>{$('#side').classList.remove('open');$('#backdrop').classList.remove('open')};

/* --------------------------------------------------------------- boot ---- */
fetch('data/book.json').then(r=>r.json()).then(b=>{
  BOOK=b;
  const secNote={}; (b.sections||[]).forEach(s=>secNote[s.title]=s.note);
  const front=LANG==='hi'?'आरम्भ':'Front matter';
  if(b.preface) FLAT.push({kind:'prose',id:'bhumika',label:b.preface.title,
    eyebrow:b.editor,section:front,sectionNote:b.publisher,data:b.preface});
  if(b.intro) FLAT.push({kind:'prose',id:'introduction',label:b.intro.title,
    eyebrow:b.editor,section:front,sectionNote:b.publisher,data:b.intro});
  if(b.abbreviations) FLAT.push({kind:'pairs',id:'abbreviations',
    label:'List of abbreviations',eyebrow:'Reference',section:front,data:b.abbreviations});
  if(b.letters) FLAT.push({kind:'pairs',id:'letters',
    label:'Names of the letters',eyebrow:'Reference',section:front,data:b.letters});
  b.chapters.forEach(c=>{
    const key=c.roman||String(c.n);
    FLAT.push({kind:'chapter',id:'ch'+c.n,num:key,
      label:c.title||('Chapter '+key),
      eyebrow:(LANG==='hi'?'अध्याय ':'Chapter ')+key,
      section:c.section||(b.subtitle),sectionNote:secNote[c.section]||'',
      data:c});
  });
  const back=LANG==='hi'?'परिशिष्ट':'Back matter';
  if(b.index&&b.index.length) FLAT.push({kind:'pairs',id:'index',
    label:'Index of names and terms',eyebrow:'Reference',section:back,data:b.index});
  if(b.mantraIndex&&b.mantraIndex.length) FLAT.push({kind:'pairs',id:'mantras',
    label:'Index of mantras',eyebrow:'Reference',section:back,data:b.mantraIndex});
  if(b.plates&&b.plates.length) FLAT.push({kind:'pairs',id:'plates',
    label:'List of deities and mantras',eyebrow:'Plates',section:back,data:b.plates});
  buildToc(); buildIndex();
  const want=FLAT.findIndex(e=>e.id===location.hash.slice(1));
  view(want<0?0:want);
}).catch(e=>{$('#view').innerHTML='<div class="loading">Could not load data/book.json — '+e+'</div>'});

document.addEventListener('click',ev=>{
  const go=ev.target.closest('[data-go]');
  if(go){ev.preventDefault();view(+go.dataset.go);return;}
  const hit=ev.target.closest('[data-k]');
  if(hit){ev.preventDefault();goHit(+hit.dataset.k);return;}
});
$('#find').onclick=openOv;
$('#menu').onclick=()=>{$('#side').classList.toggle('open');$('#backdrop').classList.toggle('open')};
$('#backdrop').onclick=closeSide;
$('#ov').onclick=e=>{if(e.target===$('#ov'))closeOv()};
let t; $('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>search(e.target.value),110)};

addEventListener('keydown',e=>{
  if($('#ov').classList.contains('open')){
    if(e.key==='Escape')closeOv();
    if(e.key==='Enter'){e.preventDefault();goHit(sel)}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const n=document.querySelectorAll('#res a');
      if(!n.length)return;
      sel=(sel+(e.key==='ArrowDown'?1:-1)+n.length)%n.length;
      n.forEach((a,i)=>a.classList.toggle('sel',i===sel));
      n[sel].scrollIntoView({block:'nearest'});
    }
    return;
  }
  if(e.target.tagName==='INPUT')return;
  if(e.key==='/'){e.preventDefault();openOv()}
  if(e.key==='ArrowRight'||e.key==='l'||e.key==='j')view(cur+1);
  if(e.key==='ArrowLeft'||e.key==='h'||e.key==='k')view(cur-1);
});

const KEY='lakshmi-siddhi-theme';
const apply=v=>{ if(v)document.documentElement.setAttribute('data-theme',v);
  else document.documentElement.removeAttribute('data-theme'); };
try{apply(localStorage.getItem(KEY))}catch(e){}
$('#theme').onclick=()=>{
  const now=document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=now==='dark'?'light':'dark';
  apply(next); try{localStorage.setItem(KEY,next)}catch(e){}
};
addEventListener('scroll',()=>{
  const h=document.body.scrollHeight-innerHeight;
  $('#bar').style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';
},{passive:true});
</script>
